body { margin: 0; color: var(--ink); font: 15px/1.5 var(--f-body);

.estrela { grid-column: 2; grid-row: 1 / span 2; border: 0; background: transparent; cursor: pointer; padding: 4px; color: var(--line); line-height: 0 }
.estrela svg { width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 1.6 }

@media (max-width: 900px) { .alas, .atalhos { grid-template-columns: minmax(0, 1fr) } }
@media (prefers-reduced-motion: no-preference) { .item, .ficha, .chips button { transition: background-color .15s, border-color .15s } }

];
const ALAS = {
  mar: { titulo: 'Multipropriedade', sub: 'Distratos GAV, Porto 2 Life e escritório Di Pallacio' },
  est: { titulo: 'Estudos', sub: 'Concursos: revisões por tema, simulados e ferramentas' },
  out: { titulo: 'Outros', sub: 'Trabalho na vara, criação e rascunhos' },
};
const COR = { mar: 'var(--mar)', est: 'var(--est)', out: 'var(--neutro)' };

const $ = (id) => document.getElementById(id);
const guarda = {
  ler(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const estado = { busca: '', vista: 'tudo', filtro: { mar: null, est: null, out: null },
  fav: new Set(guarda.ler('estante-fav', [])), rec: guarda.ler('estante-rec', []) };

const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const dataBR = (iso) => iso.split('-').reverse().slice(0, 2).join('/');
function dias(iso) { return Math.max(0, Math.floor((Date.now() - new Date(iso + 'T12:00:00').getTime()) / 864e5)); }
const ESTRELA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z" stroke-linejoin="round"></path></svg>';

function passa(it) {
  if (!estado.busca) return true;
  const q = semAcento(estado.busca);
  return semAcento(`${it.nome} ${it.desc} ${it.grupo} ${ALAS[it.ala].titulo}`).includes(q);
}

function abrir(it) {
  estado.rec = [it.id, ...estado.rec.filter((x) => x !== it.id)].slice(0, 6);
  guarda.gravar('estante-rec', estado.rec);
  desenharAtalhos();
}

function linkPara(it, cls) {
  const a = document.createElement('a');
  a.href = A(it.id); a.target = '_blank'; a.rel = 'noopener'; a.className = cls;
  a.addEventListener('click', () => abrir(it));
  return a;
}

function desenharAtalhos() {
  for (const [alvo, ids, vazio] of [
    ['favoritos', [...estado.fav], 'Toque na estrela de um artefato para fixar aqui.'],
    ['recentes', estado.rec, 'Os artefatos que você abrir por aqui aparecem nesta linha.'],
  ]) {
    const box = $(alvo); box.textContent = '';
    const lista = ids.map((id) => ITENS.find((i) => i.id === id)).filter(Boolean);
    if (!lista.length) { const p = document.createElement('p'); p.className = 'vazio'; p.textContent = vazio; box.appendChild(p); continue; }
    for (const it of lista) {
      const a = linkPara(it, 'ficha'); a.style.setProperty('--c', COR[it.ala]);
      const s = document.createElement('span'); s.textContent = it.nome; a.appendChild(s); a.title = it.nome;
      box.appendChild(a);
    }
  }
}

function itemEl(it) {
  const d = document.createElement('div'); d.className = 'item';
  const a = linkPara(it, 'nome'); a.textContent = it.nome; d.appendChild(a);
  const st = document.createElement('button'); st.type = 'button'; st.className = 'estrela'; st.innerHTML = ESTRELA;
  st.setAttribute('aria-pressed', String(estado.fav.has(it.id)));
  st.setAttribute('aria-label', (estado.fav.has(it.id) ? 'Tirar dos favoritos: ' : 'Fixar nos favoritos: ') + it.nome);
  st.addEventListener('click', () => {
    estado.fav.has(it.id) ? estado.fav.delete(it.id) : estado.fav.add(it.id);
    guarda.gravar('estante-fav', [...estado.fav]); desenhar();
  });
  d.appendChild(st);
  const p = document.createElement('div'); p.className = 'desc'; p.textContent = it.desc; d.appendChild(p);
  const m = document.createElement('div'); m.className = 'meta';
  const n = dias(it.data);
  m.textContent = `atualizado em ${dataBR(it.data)}`;
  if (n <= 7) { const t = document.createElement('span'); t.className = 'tag novo'; t.textContent = n === 0 ? 'hoje' : `há ${n} ${n === 1 ? 'dia' : 'dias'}`; m.appendChild(t); }
  else if (n > 30) { const t = document.createElement('span'); t.className = 'tag parado'; t.textContent = `parado há ${n} dias`; m.appendChild(t); }
  d.appendChild(m);
  return d;
}

function alaEl(chave) {
  const todos = ITENS.filter((i) => i.ala === chave);
  const visiveis = todos.filter(passa);
  const grupos = [...new Set(todos.map((i) => i.grupo))];
  const filtro = estado.filtro[chave];
  const sec = document.createElement('div'); sec.className = `ala ${chave}`;
  const topo = document.createElement('div'); topo.className = 'ala-topo';
  topo.innerHTML = '<div class="linha"><h2></h2><span class="conta"></span></div><p class="sub"></p><div class="chips" role="group"></div>';
  topo.querySelector('h2').textContent = ALAS[chave].titulo;
  topo.querySelector('.conta').textContent = `${todos.length} artefatos`;
  topo.querySelector('.sub').textContent = ALAS[chave].sub;
  const chips = topo.querySelector('.chips'); chips.setAttribute('aria-label', `Filtrar ${ALAS[chave].titulo}`);
  for (const g of [null, ...grupos]) {
    const b = document.createElement('button'); b.type = 'button';
    const qtd = visiveis.filter((i) => !g || i.grupo === g).length;
    b.innerHTML = '<span></span><span class="n"></span>';
    b.firstChild.textContent = g || 'Todos'; b.lastChild.textContent = qtd;
    b.setAttribute('aria-pressed', String(filtro === g));
    b.addEventListener('click', () => { estado.filtro[chave] = g; desenhar(); });
    chips.appendChild(b);
  }
  sec.appendChild(topo);
  const mostrar = visiveis.filter((i) => !filtro || i.grupo === filtro);
  if (!mostrar.length) {
    const p = document.createElement('p'); p.className = 'nada';
    p.textContent = estado.busca ? `Nada com “${estado.busca}” aqui.` : 'Nenhum artefato neste grupo.';
    sec.appendChild(p); return sec;
  }
  for (const g of grupos) {
    const doGrupo = mostrar.filter((i) => i.grupo === g);
    if (!doGrupo.length) continue;
    const gr = document.createElement('div'); gr.className = 'grupo';
    const h = document.createElement('h3'); h.textContent = g; gr.appendChild(h);
    for (const it of doGrupo) gr.appendChild(itemEl(it));
    sec.appendChild(gr);
  }
  return sec;
}

function desenhar() {
  const alas = $('alas'); alas.textContent = '';
  const v = estado.vista;
  const quais = v === 'multipropriedade' ? ['mar'] : v === 'estudos' ? ['est'] : ['mar', 'est'];
  alas.classList.toggle('uma', quais.length === 1);
  for (const k of quais) alas.appendChild(alaEl(k));
  const out = $('outros'); out.textContent = '';
  if (v === 'tudo') out.appendChild(alaEl('out'));
  const cont = (k) => ITENS.filter((i) => i.ala === k).length;
  const parados = ITENS.filter((i) => dias(i.data) > 30).length;
  $('resumo').innerHTML = '';
  $('resumo').append(
    'São ', Object.assign(document.createElement('b'), { textContent: ITENS.length }), ' artefatos: ',
    Object.assign(document.createElement('b'), { textContent: cont('mar') }), ' de multipropriedade, ',
    Object.assign(document.createElement('b'), { textContent: cont('est') }), ' de estudos e ',
    Object.assign(document.createElement('b'), { textContent: cont('out') }), ' outros. ',
    Object.assign(document.createElement('b'), { textContent: parados }), ' sem atualização há mais de 30 dias.');
  for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', String(b.dataset.v === v));
  desenharAtalhos();
}

function lerHash() {
  const h = location.hash.replace('#', '');
  estado.vista = ['multipropriedade', 'estudos'].includes(h) ? h : 'tudo';
  desenhar();
}
for (const b of document.querySelectorAll('.seg button')) b.addEventListener('click', () => {
  const v = b.dataset.v;
  if (v === 'tudo') { try { history.replaceState(null, '', location.pathname + location.search); } catch {} lerHash(); }
  else location.hash = v;
});
window.addEventListener('hashchange', lerHash);
$('busca').addEventListener('input', (e) => { estado.busca = e.target.value.trim(); desenhar(); });
lerHash();
</script>
